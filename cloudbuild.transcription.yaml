steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--cache-from'
      - 'asia-east1-docker.pkg.dev/sales-ai-automation-v2/sales-ai-automation-v2/transcription-service:v1-iterative-fix'
      - '-t'
      - 'asia-east1-docker.pkg.dev/sales-ai-automation-v2/sales-ai-automation-v2/transcription-service:v1-iterative-fix'
      - '-f'
      - 'src/transcription/Dockerfile.whisper'
      - '.'


  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-east1-docker.pkg.dev/sales-ai-automation-v2/sales-ai-automation-v2/transcription-service:v1-iterative-fix'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    timeout: 1800s  # Increase deployment timeout to 30 minutes
    args:
      - 'run'
      - 'deploy'
      - 'transcription-service'
      - '--image=asia-east1-docker.pkg.dev/sales-ai-automation-v2/sales-ai-automation-v2/transcription-service:v1-iterative-fix'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=32Gi'
      - '--cpu=8'
      - '--timeout=3600'
      - '--concurrency=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--cpu-boost'
      - '--set-env-vars=TRANSCRIPTION_ENGINE=faster_whisper,WHISPER_MODEL=large-v3-turbo,TRANSCRIPTION_LANGUAGE=zh,ENABLE_DIARIZATION=true,GCP_LOCATION=asia-southeast1,SLACK_PROGRESS_ENDPOINT=https://slack-app-acv3ye2faq-de.a.run.app/internal/transcription-progress,SLACK_PROGRESS_TOKEN=3d4ebd6a1cfe8ac77a60e8a69cc4a52a57ad482e940e52d4eb2c17c6c45801d3'
      - '--set-secrets=GEMINI_API_KEY=gemini-api-key:latest,HUGGINGFACE_TOKEN=HUGGINGFACE_TOKEN:latest'

images:
  - 'asia-east1-docker.pkg.dev/sales-ai-automation-v2/sales-ai-automation-v2/transcription-service:v1-iterative-fix'

timeout: 7200s

substitutions:
  _REGION: asia-east1



options:
  machineType: 'E2_HIGHCPU_8'
  substitutionOption: 'ALLOW_LOOSE'
