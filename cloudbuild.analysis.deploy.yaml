steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--cache-from'
      - 'asia-east1-docker.pkg.dev/sales-ai-automation-v2/sales-ai-automation-v2/analysis-service:latest'
      - '-t'
      - 'asia-east1-docker.pkg.dev/sales-ai-automation-v2/sales-ai-automation-v2/analysis-service:latest'
      - '-f'
      - 'analysis-service/Dockerfile'
      - '.'

  # 2. Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-east1-docker.pkg.dev/sales-ai-automation-v2/sales-ai-automation-v2/analysis-service:latest'

  # 3. Deploy to Cloud Run
  # We use 'gcloud run deploy' without --set-env-vars to preserve existing configuration (API keys, etc.)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'analysis-service'
      - '--image=asia-east1-docker.pkg.dev/sales-ai-automation-v2/sales-ai-automation-v2/analysis-service:latest'
      - '--region=asia-east1'
      - '--platform=managed'
      - '--timeout=600' # 10 minutes timeout for long analysis
      - '--update-env-vars=MANAGER_CHANNEL_ID=C0A4F762FE0,GCP_PROJECT_ID=sales-ai-automation-v2'
      - '--set-secrets=SLACK_BOT_TOKEN=slack-bot-token:latest'
      # Note: We do NOT set --allow-unauthenticated here to be safe, assuming it's already configured or handled by IAM.
      # If it was previously unauthenticated, it remains so.

images:
  - 'asia-east1-docker.pkg.dev/sales-ai-automation-v2/sales-ai-automation-v2/analysis-service:latest'

timeout: 1200s
