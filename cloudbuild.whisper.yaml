# Faster-Whisper Transcription Service
# 
# 部署到 Cloud Run with CPU
# - 8 vCPU + 32GB RAM
# - 60 分鐘 timeout
# - min instances = 0（省錢）
# - CPU boost（加速冷啟動）

steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-east1-docker.pkg.dev/${PROJECT_ID}/sales-ai-automation-v2/whisper-transcription-service:v1'
      - '-f'
      - 'src/transcription/Dockerfile.whisper'
      - '.'
    timeout: 3600s  # 模型下載需要時間

  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-east1-docker.pkg.dev/${PROJECT_ID}/sales-ai-automation-v2/whisper-transcription-service:v1'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    timeout: 1800s
    args:
      - 'run'
      - 'deploy'
      - 'whisper-transcription-service'
      - '--image=asia-east1-docker.pkg.dev/${PROJECT_ID}/sales-ai-automation-v2/whisper-transcription-service:v1'
      - '--region=asia-east1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      # 資源配置
      - '--memory=32Gi'
      - '--cpu=8'
      - '--timeout=3600'
      # Scaling 配置
      - '--concurrency=1'
      - '--min-instances=0'
      - '--max-instances=10'
      # CPU Boost（加速冷啟動時的模型載入）
      - '--cpu-boost'
      # 環境變數
      - '--set-env-vars=TRANSCRIPTION_ENGINE=faster_whisper,WHISPER_MODEL=large-v3-turbo,TRANSCRIPTION_LANGUAGE=zh,ENABLE_DIARIZATION=true,GCP_PROJECT_ID=${PROJECT_ID},SLACK_PROGRESS_ENDPOINT=https://slack-app-acv3ye2faq-de.a.run.app/internal/transcription-progress,SLACK_PROGRESS_TOKEN=3d4ebd6a1cfe8ac77a60e8a69cc4a52a57ad482e940e52d4eb2c17c6c45801d3'
      # Secrets
      - '--set-secrets=HUGGINGFACE_TOKEN=huggingface-token:latest'

images:
  - 'asia-east1-docker.pkg.dev/${PROJECT_ID}/sales-ai-automation-v2/whisper-transcription-service:v1'

# 整體 build 超時：2 小時（包含模型下載）
timeout: 7200s

substitutions:
  _REGION: asia-east1

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'  # 加速 build
