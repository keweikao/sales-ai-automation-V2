apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: slack-app
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
    spec:
      containers:
      - image: gcr.io/sales-ai-automation-v2/slack-app:latest
        env:
        - name: SLACK_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: slack-bot-token
              key: latest
        - name: SLACK_SIGNING_SECRET
          valueFrom:
            secretKeyRef:
              name: slack-signing-secret
              key: latest
        resources:
          limits:
            cpu: "1"
            memory: "512Mi"
