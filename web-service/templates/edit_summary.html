<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>編輯摘要 - {{ customer_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  <style>
    .editor-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem;
    }

    .editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .editor-header h1 {
      margin: 0;
      color: #333;
    }

    .editor-actions {
      display: flex;
      gap: 1rem;
    }

    .btn {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #1890ff 0%, #096dd9 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(24, 144, 255, 0.3);
    }

    .btn-secondary {
      background: #f5f5f5;
      color: #333;
      border: 1px solid #d9d9d9;
    }

    .btn-secondary:hover {
      background: #e8e8e8;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .editor-textarea {
      width: 100%;
      min-height: 500px;
      padding: 1.5rem;
      font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
      font-size: 0.95rem;
      line-height: 1.6;
      border: 1px solid #d9d9d9;
      border-radius: 8px;
      resize: vertical;
      box-sizing: border-box;
    }

    .editor-textarea:focus {
      outline: none;
      border-color: #1890ff;
      box-shadow: 0 0 0 3px rgba(24, 144, 255, 0.1);
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      padding: 1rem;
      background: #fafafa;
      border-radius: 8px;
      font-size: 0.9rem;
      color: #666;
    }

    .status-message {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-message.success {
      color: #52c41a;
    }

    .status-message.error {
      color: #f5222d;
    }

    .status-message.saving {
      color: #1890ff;
    }

    .edit-info {
      background: #e6f7ff;
      border-left: 4px solid #1890ff;
      padding: 1rem 1.5rem;
      margin-bottom: 2rem;
      border-radius: 0 8px 8px 0;
    }

    .edit-info h3 {
      margin: 0 0 0.5rem 0;
      color: #096dd9;
    }

    .edit-info p {
      margin: 0;
      color: #333;
    }

    .edit-info ul {
      margin: 0.5rem 0 0 0;
      padding-left: 1.5rem;
    }

    .preview-toggle {
      margin-bottom: 1rem;
    }

    .preview-container {
      display: none;
      padding: 2rem;
      background: white;
      border: 1px solid #d9d9d9;
      border-radius: 8px;
      min-height: 400px;
    }

    .preview-container.active {
      display: block;
    }

    .preview-container .markdown {
      line-height: 1.8;
    }

    .preview-container h1 {
      color: #333;
      border-bottom: 2px solid #1890ff;
      padding-bottom: 0.5rem;
    }

    .preview-container h2 {
      color: #555;
      margin-top: 1.5rem;
    }

    .preview-container ul {
      padding-left: 1.5rem;
    }

    .preview-container li {
      margin-bottom: 0.5rem;
    }

    .tab-buttons {
      display: flex;
      gap: 0;
      margin-bottom: 0;
    }

    .tab-btn {
      padding: 0.75rem 1.5rem;
      background: #f5f5f5;
      border: 1px solid #d9d9d9;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .tab-btn:first-child {
      border-radius: 8px 0 0 0;
    }

    .tab-btn:last-child {
      border-radius: 0 8px 0 0;
      border-left: none;
    }

    .tab-btn.active {
      background: white;
      border-bottom-color: white;
      color: #1890ff;
      font-weight: 600;
    }

    .tab-content {
      border: 1px solid #d9d9d9;
      border-top: none;
      border-radius: 0 0 8px 8px;
      overflow: hidden;
    }

    .tab-content .editor-textarea {
      border: none;
      border-radius: 0;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #1890ff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
  </style>
</head>

<body>
  <div class="editor-container">
    <div class="editor-header">
      <div>
        <h1>📝 編輯會議摘要</h1>
        <p style="margin: 0.5rem 0 0 0; color: #666;">
          <strong>客戶：</strong>{{ customer_name }} |
          <strong>業務：</strong>{{ sales_rep_name }} |
          案件編號：{{ case_id }}
        </p>
      </div>
      <div class="editor-actions">
        <a href="{{ url_for('render_summary', case_id=case_id) }}" class="btn btn-secondary">
          👁️ 預覽頁面
        </a>
        <button id="saveBtn" class="btn btn-primary" onclick="saveSummary()">
          💾 儲存變更
        </button>
      </div>
    </div>

    <div class="edit-info">
      <h3>💡 編輯說明</h3>
      <p>您可以直接編輯以下 Markdown 格式的會議摘要內容。編輯完成後點擊「儲存變更」。</p>
      <ul>
        <li>使用 <code>#</code> 來設定標題，例如 <code># 主標題</code></li>
        <li>使用 <code>-</code> 或 <code>*</code> 來建立項目清單</li>
        <li>使用 <code>**文字**</code> 來強調重點</li>
        <li>儲存後的內容會立即更新到客戶預覽頁面</li>
      </ul>
    </div>

    <div class="tab-buttons">
      <button class="tab-btn active" onclick="showTab('edit')">✏️ 編輯</button>
      <button class="tab-btn" onclick="showTab('preview')">👁️ 即時預覽</button>
    </div>

    <div class="tab-content">
      <textarea id="markdownEditor" class="editor-textarea"
        placeholder="在此輸入會議摘要內容...">{{ markdown_content }}</textarea>
      <div id="previewContainer" class="preview-container">
        <div class="markdown" id="previewContent"></div>
      </div>
    </div>

    <div class="status-bar">
      <div id="statusMessage" class="status-message">
        <span>📄 上次儲存：{{ last_updated or '尚未編輯' }}</span>
      </div>
      <div>
        <span>編輯次數：{{ edit_count }}</span>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    const caseId = "{{ case_id }}";
    const customerName = "{{ customer_name }}";
    const salesRepName = "{{ sales_rep_name }}";
    let currentTab = 'edit';

    // Insert text at cursor position
    function insertText(text) {
      const editor = document.getElementById('markdownEditor');
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      const before = editor.value.substring(0, start);
      const after = editor.value.substring(end);
      editor.value = before + text + after;
      editor.selectionStart = editor.selectionEnd = start + text.length;
      editor.focus();
    }

    // Insert a meeting summary template
    function insertTemplate() {
      const template = `# ${customerName} x iCHEF 會議記錄

親愛的 ${customerName} 您好，

感謝您撥冗與我們會談，以下是會議重點摘要：

## 會議討論重點

- 

## 後續行動項目

- 

如有任何問題，歡迎隨時與我聯繫。

祝 生意興隆！

${salesRepName}
iCHEF 業務團隊
`;
      const editor = document.getElementById('markdownEditor');
      if (editor.value.trim() === '') {
        editor.value = template;
      } else {
        if (confirm('目前已有內容，是否要覆蓋？')) {
          editor.value = template;
        }
      }
      editor.focus();
    }

    function showTab(tab) {
      currentTab = tab;
      const tabs = document.querySelectorAll('.tab-btn');
      tabs.forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');

      const editor = document.getElementById('markdownEditor');
      const preview = document.getElementById('previewContainer');

      if (tab === 'edit') {
        editor.style.display = 'block';
        preview.classList.remove('active');
      } else {
        editor.style.display = 'none';
        preview.classList.add('active');
        updatePreview();
      }
    }

    function updatePreview() {
      const content = document.getElementById('markdownEditor').value;
      document.getElementById('previewContent').innerHTML = marked.parse(content);
    }

    async function saveSummary() {
      const btn = document.getElementById('saveBtn');
      const statusEl = document.getElementById('statusMessage');
      const content = document.getElementById('markdownEditor').value;

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> 儲存中...';
      statusEl.className = 'status-message saving';
      statusEl.innerHTML = '<span class="spinner"></span> 正在儲存...';

      try {
        const response = await fetch(`/api/summary/${caseId}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ markdown: content }),
        });

        const result = await response.json();

        if (response.ok) {
          statusEl.className = 'status-message success';
          statusEl.innerHTML = '✅ 儲存成功！更新時間：' + new Date().toLocaleString('zh-TW');
          btn.innerHTML = '✅ 已儲存';
          setTimeout(() => {
            btn.innerHTML = '💾 儲存變更';
          }, 2000);
        } else {
          throw new Error(result.error || '儲存失敗');
        }
      } catch (error) {
        statusEl.className = 'status-message error';
        statusEl.innerHTML = '❌ 儲存失敗：' + error.message;
        btn.innerHTML = '❌ 儲存失敗';
      } finally {
        btn.disabled = false;
      }
    }

    // Auto-update preview when typing
    document.getElementById('markdownEditor').addEventListener('input', function () {
      if (currentTab === 'preview') {
        updatePreview();
      }
    });
  </script>
</body>

</html>
