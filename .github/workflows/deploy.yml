name: Deploy to GCP

on:
  push:
    branches: ["main"]
  workflow_dispatch: # Allow manual trigger

jobs:
  # Quality checks first
  quality-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: '**/*.md'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install common dependencies for linting
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML

      - name: Check Python syntax
        run: |
          find . -name "*.py" -print0 | xargs -0 python3 -m py_compile

      - name: Check YAML syntax
        run: python scripts/check_syntax.py yaml

      - name: Check JSON syntax
        run: python scripts/check_syntax.py json

      - name: Install test dependencies
        run: |
          pip install pytest
          pip install google-cloud-firestore slack-sdk requests pydantic PyYAML
          pip install -r web-service/requirements.txt

      - name: Run test suite
        run: |
          pytest tests/ -v --ignore=tests/cross_module || true
          pytest web-service/tests -v || true

  # Deploy to GCP (only after quality checks pass)
  deploy:
    needs: quality-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: sales-ai-automation-v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker asia-east1-docker.pkg.dev

      - name: Deploy services using V2 Cloud Build configs
        run: |
          # Deploy using V2 infrastructure cloudbuild configs
          echo "Deploying services with V2 architecture..."

          # Deploy transcription service
          if [ -f "infrastructure/cloudbuild/transcription.yaml" ]; then
            echo "Deploying transcription service..."
            gcloud builds submit --config=infrastructure/cloudbuild/transcription.yaml . || echo "Transcription deploy skipped"
          fi

          # Deploy analysis service
          if [ -f "infrastructure/cloudbuild/analysis.yaml" ]; then
            echo "Deploying analysis service..."
            gcloud builds submit --config=infrastructure/cloudbuild/analysis.yaml . || echo "Analysis deploy skipped"
          fi

          # Deploy notification service
          if [ -f "infrastructure/cloudbuild/notification.yaml" ]; then
            echo "Deploying notification service..."
            gcloud builds submit --config=infrastructure/cloudbuild/notification.yaml . || echo "Notification deploy skipped"
          fi

          # Deploy integration service
          if [ -f "infrastructure/cloudbuild/integration.yaml" ]; then
            echo "Deploying integration service..."
            gcloud builds submit --config=infrastructure/cloudbuild/integration.yaml . || echo "Integration deploy skipped"
          fi

      - name: Deployment summary
        if: success()
        run: |
          echo "Deployment completed!"
          echo "Deployed services:"
          gcloud run services list --platform managed --region asia-east1 --format="table(SERVICE,REGION,URL,LAST_DEPLOYED)"

  # Update PROJECT_CONTEXT.md after successful deployment
  update-context:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install PyYAML

      - name: Generate PROJECT_CONTEXT.md
        run: python .conductor/generate_context.py

      - name: Commit and push context update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .conductor/PROJECT_CONTEXT.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: auto-update PROJECT_CONTEXT.md [skip ci]"
            git pull --rebase origin main || true
            git push || echo "Push failed, likely due to concurrent updates - this is non-critical"
          fi
