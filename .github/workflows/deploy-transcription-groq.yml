name: Deploy Transcription Service (Groq Whisper)

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches:
      - main
    paths:
      - 'infrastructure/services/transcription/**'
      - 'infrastructure/cloudbuild/transcription.yaml'
      - 'infrastructure/docker/Dockerfile.transcription'
      - '.github/workflows/deploy-transcription-groq.yml'

env:
  PROJECT_ID: sales-ai-automation-v2
  REGION: asia-east1
  SERVICE_NAME: transcription-service

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Google Auth
      id: auth
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.PROJECT_ID }}

    - name: Prepare for Deployment
      run: |
        echo "Preparing Groq Whisper deployment..."
        echo "   Project: ${{ env.PROJECT_ID }}"
        echo "   Region: ${{ env.REGION }}"
        echo "   Service: ${{ env.SERVICE_NAME }}"
        echo "   Engine: groq_whisper"
        echo ""
        echo "Note: GROQ_API_KEY must exist in Secret Manager"
        echo "      with proper Service Account permissions."
        echo ""

    - name: Submit Cloud Build (Groq Whisper)
      run: |
        echo "Starting Cloud Build for Groq Whisper transcription service..."
        gcloud builds submit \
          --config=infrastructure/cloudbuild/transcription.yaml \
          --project=${{ env.PROJECT_ID }}

    - name: Verify Deployment
      run: |
        echo "Verifying deployment..."
        gcloud run services describe ${{ env.SERVICE_NAME }} \
          --region=${{ env.REGION }} \
          --project=${{ env.PROJECT_ID }} \
          --format="value(status.url)"

        echo ""
        echo "Deployment successful!"

    - name: Deployment Summary
      run: |
        echo "=========================================="
        echo "  Groq Whisper Transcription Deployed"
        echo "=========================================="
        echo ""
        echo "Configuration:"
        echo "  Engine: groq_whisper"
        echo "  Model: whisper-large-v3-turbo"
        echo "  Speed: 228x realtime"
        echo ""
